<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BliemBoard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=block');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ─── COLOR SYSTEM ─────────────────────────────────────────── */
    :root {
      --text-1: oklch(95% 0 0);
      --text-2: oklch(85% 0 0);
      --text-3: oklch(75% 0 0);
      --text-4: oklch(60% 0 0);
      --text-5: oklch(40% 0 0);
      --bg-1: oklch(31% 0 0 / 0.75);
      --bg-2: oklch(27% 0 0 / 0.70);
      --bg-3: oklch(23% 0 0 / 0.65);
      --bg-4: oklch(19% 0 0 / 0.60);
      --hover:    oklch(54% 0 0 / 0.10);
      --active:   oklch(54% 0 0 / 0.20);
      --active-2: oklch(54% 0 0 / 0.30);
      --border-light: oklch(54% 0 0 / 0.10);
      --border:       oklch(54% 0 0 / 0.20);
      --border-hover: oklch(73% 0.07 105);
      /* Gold scale */
      --gold-1: oklch(78% 0.07 105);
      --gold-2: oklch(73% 0.07 105);
      --gold-3: oklch(68% 0.07 105);
      --gold-4: oklch(63% 0.07 105);
      --gold-5: oklch(58% 0.07 105);
      /* Accent aliases */
      --accent-1: var(--gold-1);
      --accent-2: var(--gold-2);
      --accent-3: var(--gold-3);
      --accent-4: var(--gold-4);
      --accent-5: var(--gold-5);
      /* Danger */
      --red-2: oklch(70% 0.13 0);
      /* Title colors (Terminal MCP look) */
      --title-cyan: #5cf0f0;
      --title-pink: #ff5ec4;
    }

    /* ─── BODY & BACKGROUND ─────────────────────────────────────── */
    html, body {
      min-height: 100vh;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      color: var(--text-2);
      background: #111214;
      overflow-x: hidden;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }

    /* ─── HEADER / TITLE BLOCK ──────────────────────────────────── */
    .header {
      background: var(--bg-2);
      border: 1px solid var(--border);
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .title-block {
      padding: 1.5rem 1.5rem 1.2rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .title-block img.ascii-title {
      display: block;
      width: 100%;
      height: auto;
    }

    .header-meta {
      padding: 0.65rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-5);
      letter-spacing: 0.04em;
    }

    .header-meta .version {
      color: var(--accent-2);
    }

    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: oklch(70% 0.12 170);
      margin-right: 6px;
      box-shadow: 0 0 6px oklch(70% 0.12 170 / 0.6);
    }

    /* ─── CONTROLS BAR ──────────────────────────────────────────── */
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-top: none;
      padding: 10px 14px;
      margin-bottom: 1rem;
    }

    .controls-sep {
      flex: 1;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume-control label {
      font-size: 11px;
      color: var(--text-5);
      letter-spacing: 0.06em;
    }

    .volume-control input[type="range"] {
      width: 110px;
      height: 3px;
      background: var(--border);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
      border-radius: 2px;
    }

    .volume-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      background: var(--accent-2);
      cursor: pointer;
      border-radius: 2px;
    }

    .volume-control input[type="range"]::-moz-range-thumb {
      width: 12px; height: 12px;
      background: var(--accent-2);
      cursor: pointer;
      border: none;
      border-radius: 2px;
    }

    .volume-value {
      font-size: 11px;
      color: var(--accent-1);
      min-width: 34px;
    }

    .btn-primary {
      background: var(--active);
      color: var(--accent-1);
      border: 1px solid var(--accent-5);
      padding: 6px 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      border-radius: 4px;
      transition: all 0.12s;
    }

    .btn-primary:hover {
      background: color-mix(in oklch, var(--accent-3), transparent 75%);
      border-color: var(--accent-2);
      color: var(--accent-1);
    }

    .btn-primary:active {
      background: color-mix(in oklch, var(--accent-3), transparent 60%);
    }

    .btn-danger {
      background: var(--active);
      color: var(--red-2);
      border: 1px solid oklch(70% 0.13 0 / 0.35);
      padding: 6px 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      border-radius: 4px;
      transition: all 0.12s;
    }

    .btn-danger:hover {
      background: oklch(70% 0.13 0 / 0.12);
      border-color: var(--red-2);
    }

    /* ─── GRID ──────────────────────────────────────────────────── */
    .soundboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      margin-bottom: 1rem;
      min-height: 140px;
    }

    .sound-button {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      background: var(--bg-2);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      transition: background 0.12s, border-color 0.12s;
      overflow: hidden;
      font-family: inherit;
      font-size: 11px;
      color: var(--text-3);
      border-radius: 6px;
    }

    .sound-button:hover {
      border-color: var(--border-hover);
      background: var(--hover);
    }

    .sound-button:active {
      background: var(--active);
    }

    .sound-button.playing {
      border-color: var(--accent-2);
      background: color-mix(in oklch, var(--accent-4), transparent 82%);
      color: var(--accent-1);
      box-shadow: 0 0 0 1px var(--accent-5) inset;
    }

    .progress-bar {
      position: absolute;
      top: 0; left: 0;
      height: 3px;
      width: 0%;
      background: var(--accent-2);
      pointer-events: none;
      z-index: 2;
      border-radius: 6px 6px 0 0;
    }

    .sound-button > * { position: relative; z-index: 1; }

    .sound-image {
      width: 100%; height: 60%;
      object-fit: cover;
      margin-bottom: 7px;
      border-radius: 3px;
      opacity: 0.85;
    }

    .sound-label {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--text-3);
    }

    .sound-button.playing .sound-label { color: var(--accent-1); }

    .playing-tag {
      display: none;
      font-size: 9px;
      color: var(--accent-2);
      letter-spacing: 0.1em;
      margin-top: 4px;
    }

    .sound-button.playing .playing-tag { display: block; }

    /* hover action menu */
    .button-menu {
      position: absolute;
      top: 4px; right: 4px;
      background: var(--bg-4);
      border: 1px solid var(--border);
      padding: 3px 4px;
      display: flex;
      gap: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s;
      border-radius: 4px;
    }

    .sound-button:hover .button-menu {
      opacity: 1;
      pointer-events: auto;
    }

    .icon-btn {
      width: 20px; height: 20px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: color 0.1s;
      font-family: inherit;
      border-radius: 3px;
    }

    .icon-btn:hover { color: var(--accent-1); background: var(--hover); }

    .add-button {
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-5);
    }

    .add-button:hover {
      border-color: var(--accent-4);
      border-style: solid;
      color: var(--accent-2);
      background: var(--hover);
    }

    /* ─── MODAL ──────────────────────────────────────────────────── */
    .edit-overlay {
      position: fixed;
      inset: 0;
      background: oklch(0% 0 0 / 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .edit-overlay.show { display: flex; }

    .edit-modal {
      background: var(--bg-1);
      border: 1px solid var(--border-hover);
      padding: 0;
      min-width: 320px;
      max-width: 420px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 16px 48px oklch(0% 0 0 / 0.5);
    }

    .modal-titlebar {
      background: color-mix(in oklch, var(--accent-4), transparent 78%);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--accent-1);
    }

    .modal-body { padding: 16px; }

    .modal-header {
      font-size: 11px;
      color: var(--text-4);
      margin-bottom: 10px;
      letter-spacing: 0.04em;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      flex: 1;
      padding: 7px 14px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: all 0.1s;
      color: var(--text-3);
      border-radius: 4px;
    }

    .btn:hover {
      border-color: var(--text-5);
      background: var(--hover);
    }

    .btn-primary-modal {
      color: var(--accent-1);
      border-color: var(--accent-5);
    }

    .btn-primary-modal:hover {
      background: color-mix(in oklch, var(--accent-3), transparent 75%);
      border-color: var(--accent-2);
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: var(--bg-4);
      color: var(--accent-1);
      font-family: inherit;
      font-size: 12px;
      margin-bottom: 4px;
      caret-color: var(--accent-1);
      outline: none;
      box-sizing: border-box;
      border-radius: 4px;
    }

    input[type="text"]:focus {
      border-color: var(--accent-4);
      box-shadow: 0 0 0 2px color-mix(in oklch, var(--accent-3), transparent 80%);
    }

    input[type="file"] { display: none; }

    /* ─── FOOTER INFO ────────────────────────────────────────────── */
    .info-text {
      font-size: 10px;
      color: var(--text-5);
      line-height: 1.8;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-top: none;
      padding: 8px 14px;
      border-radius: 0 0 6px 6px;
      letter-spacing: 0.03em;
    }

    /* ─── TOAST ──────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--bg-1);
      border: 1px solid var(--accent-4);
      color: var(--accent-1);
      padding: 9px 16px;
      font-size: 11px;
      font-family: inherit;
      letter-spacing: 0.05em;
      z-index: 2000;
      border-radius: 6px;
      box-shadow: 0 4px 20px oklch(0% 0 0 / 0.4);
      animation: slideIn 0.15s ease;
    }

    @keyframes slideIn {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="title-block">
      <canvas id="ascii-canvas" style="display:block;width:100%;height:auto;"></canvas>
    </div>
    <div class="header-meta">
      <span><span class="status-dot"></span>ready</span>
      <span class="version">v2.0</span>
    </div>
  </div>

  <!-- ── CONTROLS ── -->
  <div class="controls">
    <button class="btn-primary" onclick="addSound()">+ Add Sound</button>
    <button class="btn-danger" onclick="stopAll()">■ Stop All</button>
    <div class="controls-sep"></div>
    <div class="volume-control">
      <label for="masterVolume">VOL</label>
      <input type="range" id="masterVolume" min="0" max="100" value="70" oninput="setMasterVolume(this.value)">
      <span class="volume-value" id="volumeValue">70%</span>
    </div>
  </div>

  <!-- ── PADS ── -->
  <div id="soundboard" class="soundboard-grid"></div>

  <!-- ── RENAME MODAL ── -->
  <div id="editOverlay" class="edit-overlay">
    <div class="edit-modal">
      <div class="modal-titlebar">RENAME SOUND</div>
      <div class="modal-body">
        <div class="modal-header">Enter new label:</div>
        <input type="text" id="editInput" placeholder="sound_name">
        <div class="modal-buttons">
          <button class="btn" onclick="closeEdit()">Cancel</button>
          <button class="btn btn-primary-modal" onclick="saveEdit()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── FOOTER ── -->
  <div class="info-text">
    Click <strong style="color:var(--accent-2)">+ Add Sound</strong> to load mp3 / wav / ogg / mp4 files.
    Hover a pad to add image, rename, or delete.
    Click to play · <strong style="color:var(--accent-2)">■ Stop All</strong> to silence everything.
  </div>

</div>

<script>
  /* ─── ASCII TITLE CANVAS ───────────────────────────────────── */
  (function() {
    const lines = [
      "██████╗ ██╗     ██╗███████╗███╗   ███╗██████╗  ██████╗  █████╗ ██████╗ ██████╗ ",
      "██╔══██╗██║     ██║██╔════╝████╗ ████║██╔══██╗██╔═══██╗██╔══██╗██╔══██╗██╔══██╗",
      "██████╔╝██║     ██║█████╗  ██╔████╔██║██████╔╝██║   ██║███████║██████╔╝██║  ██║",
      "██╔══██╗██║     ██║██╔══╝  ██║╚██╔╝██║██╔══██╗██║   ██║██╔══██║██╔══██╗██║  ██║",
      "██████╔╝███████╗██║███████╗██║ ╚═╝ ██║██████╔╝╚██████╔╝██║  ██║██║  ██║██████╔╝",
      "╚═════╝ ╚══════╝╚═╝╚══════╝╚═╝     ╚═╝╚═════╝  ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝╚═════╝"
    ];

    const FONT_PX = 14;
    const FONT = `${FONT_PX}px "Courier New", Courier, monospace`;
    const COLOR = "#5cf0f0";
    const PAD_X = 24, PAD_Y = 20;

    const canvas = document.getElementById('ascii-canvas');
    const ctx = canvas.getContext('2d');

    // Measure in offscreen context to get exact char width
    ctx.font = FONT;
    const cw = ctx.measureText("█").width;
    const ch = FONT_PX * 1.22; // line height

    const maxLen = Math.max(...lines.map(l => l.length));
    const W = Math.ceil(maxLen * cw) + PAD_X * 2;
    const H = Math.ceil(lines.length * ch) + PAD_Y * 2;

    canvas.width  = W;
    canvas.height = H;
    // set intrinsic size for correct aspect ratio via CSS width:100%
    canvas.style.aspectRatio = `${W} / ${H}`;

    ctx.clearRect(0, 0, W, H);
    ctx.font = FONT;
    ctx.fillStyle = COLOR;
    ctx.textBaseline = "top";

    lines.forEach((line, i) => {
      ctx.fillText(line, PAD_X, PAD_Y + i * ch);
    });
  })();

  /* ─── APP LOGIC ────────────────────────────────────────────── */
  const DB_NAME = 'SoundboardDB';
  const DB_VERSION = 1;
  const STORE_NAME = 'sounds';

  let db = null;
  let audioContext = null;
  let masterGainNode = null;
  let activeSources = [];
  let activeAnimations = new Map();
  let editingId = null;

  function initIndexedDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject('Failed to open IndexedDB');
      request.onsuccess = () => { db = request.result; resolve(); };
      request.onupgradeneeded = (event) => {
        const database = event.target.result;
        if (!database.objectStoreNames.contains(STORE_NAME)) {
          database.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
    });
  }

  function loadSounds() {
    return new Promise((resolve, reject) => {
      const t = db.transaction([STORE_NAME], 'readonly');
      const req = t.objectStore(STORE_NAME).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject('Failed to load sounds');
    });
  }

  function saveSound(sound) {
    return new Promise((resolve, reject) => {
      const t = db.transaction([STORE_NAME], 'readwrite');
      const req = t.objectStore(STORE_NAME).put(sound);
      req.onsuccess = () => resolve();
      req.onerror = () => reject('Failed to save sound');
    });
  }

  function deleteFromDB(id) {
    return new Promise((resolve, reject) => {
      const t = db.transaction([STORE_NAME], 'readwrite');
      const req = t.objectStore(STORE_NAME).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject('Failed to delete sound');
    });
  }

  function initAudioContext() {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      masterGainNode = audioContext.createGain();
      masterGainNode.connect(audioContext.destination);
      masterGainNode.gain.value = 0.7;
    }
    return audioContext;
  }

  async function decodeAudio(arrayBuffer) {
    const ctx = initAudioContext();
    return new Promise((resolve, reject) => {
      ctx.decodeAudioData(arrayBuffer,
        (buffer) => resolve(buffer),
        (error) => { console.error('Decode error:', error); reject('Failed to decode audio'); }
      );
    });
  }

  async function playSound(soundId) {
    try {
      const sounds = await loadSounds();
      const sound = sounds.find(s => s.id === soundId);
      if (!sound || !sound.audioData) { showToast('Sound data not found'); return; }

      const ctx = initAudioContext();
      const audioBuffer = await decodeAudio(sound.audioData);
      const duration = audioBuffer.duration * 1000;

      const source = ctx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(masterGainNode);
      source.start(0);
      activeSources.push(source);

      const btn = document.querySelector(`[data-sound-id="${soundId}"]`);
      if (btn) {
        btn.classList.add('playing');
        if (activeAnimations.has(soundId)) activeAnimations.get(soundId).cancel();

        let progressBar = btn.querySelector('.progress-bar');
        if (!progressBar) {
          progressBar = document.createElement('div');
          progressBar.className = 'progress-bar';
          btn.insertBefore(progressBar, btn.firstChild);
        }
        progressBar.style.width = '0%';

        const animation = progressBar.animate(
          [{ width: '0%' }, { width: '100%' }],
          { duration, easing: 'linear', fill: 'forwards' }
        );
        activeAnimations.set(soundId, animation);

        setTimeout(() => {
          btn.classList.remove('playing');
          animation.cancel();
          progressBar.style.width = '0%';
          activeAnimations.delete(soundId);
        }, duration);
      }

      source.onended = () => { activeSources = activeSources.filter(s => s !== source); };
    } catch (error) {
      showToast('Error playing sound: ' + error);
      console.error('Play error:', error);
    }
  }

  function stopAll() {
    activeSources.forEach(source => { try { source.stop(); } catch(e) {} });
    activeSources = [];
    activeAnimations.forEach((animation, soundId) => {
      animation.cancel();
      const btn = document.querySelector(`[data-sound-id="${soundId}"]`);
      if (btn) {
        const pb = btn.querySelector('.progress-bar');
        if (pb) pb.style.width = '0%';
        btn.classList.remove('playing');
      }
    });
    activeAnimations.clear();
  }

  function setMasterVolume(value) {
    if (masterGainNode) {
      masterGainNode.gain.value = value / 100;
      document.getElementById('volumeValue').textContent = value + '%';
    }
  }

  async function addSound() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'audio/*,video/mp4';
    input.onchange = async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const reader = new FileReader();
        reader.onload = async (event) => {
          const arrayBuffer = event.target?.result;
          if (arrayBuffer) {
            const id = Date.now().toString();
            await saveSound({ id, name: file.name.replace(/\.[^/.]+$/, ''), audioData: arrayBuffer, imageData: null });
            render();
            showToast('Sound added!');
          }
        };
        reader.readAsArrayBuffer(file);
      } catch (error) { showToast('Error: ' + error); }
    };
    input.click();
  }

  async function addImage(soundId) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const reader = new FileReader();
        reader.onload = async (event) => {
          const sounds = await loadSounds();
          const sound = sounds.find(s => s.id === soundId);
          if (sound) {
            sound.imageData = event.target?.result;
            await saveSound(sound);
            render();
            showToast('Image added!');
          }
        };
        reader.readAsDataURL(file);
      } catch (error) { showToast('Error: ' + error); }
    };
    input.click();
  }

  function openEdit(soundId, name) {
    editingId = soundId;
    const input = document.getElementById('editInput');
    input.value = name;
    document.getElementById('editOverlay').classList.add('show');
    setTimeout(() => input.focus(), 0);
  }

  function closeEdit() {
    document.getElementById('editOverlay').classList.remove('show');
    editingId = null;
  }

  async function saveEdit() {
    const newName = document.getElementById('editInput').value;
    if (editingId && newName.trim()) {
      try {
        const sounds = await loadSounds();
        const sound = sounds.find(s => s.id === editingId);
        if (sound) {
          sound.name = newName;
          await saveSound(sound);
          render();
          showToast('Renamed!');
        }
      } catch (error) { showToast('Error: ' + error); }
    }
    closeEdit();
  }

  async function deleteSound(soundId) {
    if (confirm('Delete this sound?')) {
      try {
        await deleteFromDB(soundId);
        render();
        showToast('Sound deleted');
      } catch (error) { showToast('Error: ' + error); }
    }
  }

  function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }

  async function render() {
    try {
      const sounds = await loadSounds();
      const soundboard = document.getElementById('soundboard');
      soundboard.innerHTML = '';

      sounds.forEach(sound => {
        const btn = document.createElement('button');
        btn.className = 'sound-button';
        btn.title = sound.name;
        btn.type = 'button';
        btn.setAttribute('data-sound-id', sound.id);
        btn.onclick = () => playSound(sound.id);

        let html = '';
        if (sound.imageData) html += `<img src="${sound.imageData}" alt="" class="sound-image">`;
        html += `<span class="sound-label">${sound.name}</span>`;
        html += `<span class="playing-tag">▶ playing</span>`;
        html += `<div class="button-menu">`;
        html += `<button class="icon-btn" type="button" title="Add image" onclick="addImage('${sound.id}'); event.stopPropagation();">🖼</button>`;
        html += `<button class="icon-btn" type="button" title="Rename" onclick="openEdit('${sound.id}', '${sound.name.replace(/'/g, "\\'")}'); event.stopPropagation();">✏</button>`;
        html += `<button class="icon-btn" type="button" title="Delete" onclick="deleteSound('${sound.id}'); event.stopPropagation();">✕</button>`;
        html += `</div>`;
        btn.innerHTML = html;
        soundboard.appendChild(btn);
      });

      const addBtn = document.createElement('label');
      addBtn.className = 'sound-button add-button';
      addBtn.title = 'Add new sound';
      addBtn.innerHTML = `<span style="font-size:26px;opacity:0.5;">+</span>`;
      addBtn.onclick = addSound;
      soundboard.appendChild(addBtn);
    } catch (error) { console.error('Render error:', error); }
  }

  document.getElementById('editInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') saveEdit();
  });
  document.getElementById('editOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('editOverlay')) closeEdit();
  });

  window.addImage = addImage;
  window.openEdit = openEdit;
  window.deleteSound = deleteSound;
  window.addSound = addSound;
  window.stopAll = stopAll;
  window.setMasterVolume = setMasterVolume;

  (async () => {
    try {
      await initIndexedDB();
      initAudioContext();
      await render();
    } catch (error) {
      console.error('Init error:', error);
      showToast('Failed to initialize app');
    }
  })();
</script>
</body>
</html>
