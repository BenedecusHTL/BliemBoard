[package]
name = "soundboard-tauri"
version = "2.0.0"
description = "A terminal MCP style Soundboard"
authors = ["You"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset", "tray-icon", "image-ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ringbuf = "0.5.1"
base64 = "0.23.1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12.5"
once_cell = "1.21.4"
rodio = "0.19.0"
cpal = "0.15.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2"
zip = "8.6.0"
rdev = "0.5.3"
lazy_static = "1.5.0"
figlet-rs = "1.0.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
